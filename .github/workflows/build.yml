name: Build desktop apps
on:
  push:
    branches: [main]
    # the phone version (docs/) is a web page; changing it does not need new desktop downloads
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Make sure the Downloads page ("latest" release) exists before the builds add files to it.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "${{ github.sha }}" --title "SP Inventory downloads" --notes "Newest version of SP Inventory."

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # Apple-chip Mac machines are often fully booked on GitHub; the Intel ones are easy to get and build both Mac versions.
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Allowed to add files to the Downloads page; nothing else.
    permissions:
      contents: write
    steps:
      # Each helper step is locked to one exact, reviewed version (the long code), so it cannot
      # change underneath you. Versions: checkout v6.1.0, setup-node v6.5.0.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      # Installs exactly the versions in package-lock.json, checked against their fingerprints.
      - name: Install exactly the locked building blocks
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Check every building block is signed by the npm registry
        shell: bash
        run: |
          set +e
          npm audit signatures > "$RUNNER_TEMP/signatures.txt" 2>&1; rc=$?; echo "exit=$rc" >> "$RUNNER_TEMP/signatures.txt"
          cat "$RUNNER_TEMP/signatures.txt"
          exit $rc
      # Report any known security problems in the building blocks (shown in the test reports; does not stop the build).
      - name: Check building blocks for known security problems
        shell: bash
        run: |
          rc=0; npm audit --audit-level=high > "$RUNNER_TEMP/audit.txt" 2>&1 || rc=$?; echo "exit=$rc" >> "$RUNNER_TEMP/audit.txt"
          cat "$RUNNER_TEMP/audit.txt"
      - name: Build the app
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --publish never 2>&1 | tee "$RUNNER_TEMP/builder.txt"
      # Start the finished app once to prove it opens with all its safety locks on.
      - name: Test the finished app (open, add, sell, save, backup, reopen)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$(uname -m)" = "arm64" ]; then app=$(ls -d dist/mac-arm64/*.app | head -1); else app=$(ls -d dist/mac/*.app | head -1); fi
            exe="$app/Contents/MacOS/$(basename "$app" .app)"
          else
            exe="dist/win-unpacked/SP Inventory.exe"
          fi
          export SP_SMOKE_FILE="$RUNNER_TEMP/smoke.txt"
          "$exe" --smoke-test > "$RUNNER_TEMP/app-output.txt" 2>&1 || true
          cat "$SP_SMOKE_FILE"; grep -q "SMOKE TEST OK" "$SP_SMOKE_FILE"
      - name: Check the Mac download itself (signature intact, app inside opens)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          exec > >(tee "$RUNNER_TEMP/dmg-check.txt") 2>&1
          set -e
          if [ "$(uname -m)" = "arm64" ]; then dmg=$(ls dist/*-arm64.dmg | head -1); else dmg=$(ls dist/*.dmg | grep -v arm64 | head -1); fi; echo "Checking $dmg"
          for d in dist/*.dmg; do hdiutil verify "$d"; done
          hdiutil verify "$dmg"
          mnt=$(mktemp -d); hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
          app=$(ls -d "$mnt"/*.app | head -1); ls "$mnt"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Signature|flags" || true
          cp -R "$app" "$RUNNER_TEMP/"; hdiutil detach "$mnt" >/dev/null
          export SP_SMOKE_FILE="$RUNNER_TEMP/smoke-dmg.txt"
          "$RUNNER_TEMP/$(basename "$app")/Contents/MacOS/$(basename "$app" .app)" --smoke-test || true
          cat "$SP_SMOKE_FILE"; grep -q "SMOKE TEST OK" "$SP_SMOKE_FILE"
      - name: Share the test report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          f="$RUNNER_TEMP/smoke.txt"; [ -f "$f" ] || { echo "no report written"; echo "--- build output (end) ---"; tail -40 "$RUNNER_TEMP/builder.txt" 2>/dev/null; echo "--- app output (end) ---"; tail -40 "$RUNNER_TEMP/app-output.txt" 2>/dev/null; } > "$f"
          [ -f "$RUNNER_TEMP/signatures.txt" ] && cp "$RUNNER_TEMP/signatures.txt" "test-report-signatures-${RUNNER_OS}.txt" && gh release upload latest "test-report-signatures-${RUNNER_OS}.txt" --clobber
          [ -f "$RUNNER_TEMP/audit.txt" ] && cp "$RUNNER_TEMP/audit.txt" "test-report-audit-${RUNNER_OS}.txt" && gh release upload latest "test-report-audit-${RUNNER_OS}.txt" --clobber
          cp "$f" "test-report-${RUNNER_OS}.txt"; gh release upload latest "test-report-${RUNNER_OS}.txt" --clobber
          if [ -f "$RUNNER_TEMP/dmg-check.txt" ]; then { cat "$RUNNER_TEMP/dmg-check.txt"; echo; cat "$RUNNER_TEMP/smoke-dmg.txt" 2>/dev/null; } > test-report-dmg.txt; gh release upload latest test-report-dmg.txt --clobber; fi
      - name: Fingerprints of the files
        shell: bash
        run: |
          cd dist && shopt -s nullglob
          for f in *.dmg *.exe; do printf '%s  %s\n' "$(node -e "const c=require('crypto'),fs=require('fs');process.stdout.write(c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'))" "$f")" "$f"; done > "checksums-${RUNNER_OS}.txt"
          cat "checksums-${RUNNER_OS}.txt"
      - name: Put the new files on the Downloads page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe dist/checksums-*.txt)
          if [ ${#files[@]} -eq 0 ]; then echo "No app files were made"; exit 1; fi
          gh release upload latest "${files[@]}" --clobber
          # Share the exact list of building blocks used, so it can be locked in the project.
          if [ "$RUNNER_OS" = "macOS" ] && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then gh release upload latest package-lock.json --clobber; fi

  notes:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Remove downloads left over from the old app name.
          gh release view latest --json assets -q '.assets[].name' | grep -v -E '^(SP\.Inventory|checksums-|test-report|package-lock)' | while read -r f; do gh release delete-asset latest "$f" -y; done
          mkdir -p sums && gh release download latest -p 'checksums-*.txt' -D sums --clobber || true
          sums=$(cat sums/*.txt 2>/dev/null)
          gh release edit latest --title "SP Inventory downloads" --notes "$(printf 'Newest version, built %s.\n\n**Mac (newer, Apple M1/M2/M3...):** the file ending in -arm64.dmg\n**Mac (older, Intel):** the other .dmg\n**Windows:** the .exe (runs without installing)\n\nThe first time on Mac: System Settings > Privacy & Security > Open Anyway. On Windows: More info > Run anyway.\n\n**File fingerprints (SHA-256)**, to check a download is the real one:\n```\n%s\n```' "$(date -u '+%Y-%m-%d %H:%M UTC')" "$sums")"
